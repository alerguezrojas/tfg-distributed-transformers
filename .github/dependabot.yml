# Actualizaciones semanales y agrupadas: un PR por ecosistema en vez de uno por paquete.
# Los PR van a develop (las ramas salen de develop; ver AGENTS.md, "Convenciones").
version: 2
updates:
  - package-ecosystem: uv            # lee pyproject.toml y uv.lock
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns: ["*"]
    # torch y torchvision se suben a mano: hay que validar la rueda CUDA en las GPU (local y
    # Verode, donde cu13 no funciona con su driver) y que el golden no cambia. Ver AGENTS.md.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
