# Actualizaciones semanales y agrupadas: un PR por ecosistema en vez de uno por paquete.
# Los PR van a develop (las ramas salen de develop; ver AGENTS.md, "Convenciones").
version: 2
updates:
  - package-ecosystem: uv            # lee pyproject.toml y uv.lock
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
