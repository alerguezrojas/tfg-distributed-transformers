name: CI

# Runs the test suite on every push and pull request. The tests are CPU-only
# (no GPU/dataset needed), so they run on the standard GitHub-hosted runners.

# Quoted so YAML 1.1 parsers (VS Code) don't coerce the key `on` to the boolean
# `true` (the "Norway problem"); GitHub Actions reads it the same either way.
"on":
  push:
    branches: [main, develop]
  pull_request:

# Mínimos privilegios: ningún job de este workflow escribe en el repo.
permissions:
  contents: read

# Un push nuevo al mismo PR/rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (CPU-only torch)
        run: |
          uv sync --frozen
          # Replace the CUDA torch wheel from the lock with the CPU build:
          # the CI runners have no GPU and the CUDA wheel is multi-GB.
          uv pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff — errores reales, ver [tool.ruff])
        run: uv run ruff check src scripts tests

      - name: Run test suite
        run: uv run pytest -q

  # Auditoría de dependencias con vulnerabilidades conocidas (base OSV/PyPI). Bloquea el PR.
  # Avisos aceptados (cada uno con su motivo; revisar al actualizar torch):
  #   GHSA-rrmf-rvhw-rf47 (CVE-2025-3000, torch): corrupción de memoria en torch.jit.script;
  #     el proyecto no usa torch.jit. Se corrige en torch 2.13: pendiente de validar en las GPU
  #     (local y Verode) antes de subir torch.
  #   GHSA-xmj3-9gf7-h52w y PYSEC-2026-3447 (setuptools < 83/84, lo fija torch): fallos al
  #     instalar ruedas antiguas en Windows y al aplicar MANIFEST.in al construir paquetes; aquí
  #     no se construyen paquetes ni se instala en Windows.
  # Ignorar otro aviso: añadir `--ignore-vuln <ID>` con su motivo en este comentario.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project --no-annotate > requirements-audit.txt

      - name: pip-audit
        run: >-
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip
          --ignore-vuln GHSA-rrmf-rvhw-rf47 --ignore-vuln PYSEC-2025-194
          --ignore-vuln GHSA-xmj3-9gf7-h52w --ignore-vuln PYSEC-2026-3447
