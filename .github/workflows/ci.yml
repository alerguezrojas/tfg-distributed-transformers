name: CI

# Runs the test suite on every push and pull request. The tests are CPU-only
# (no GPU/dataset needed), so they run on the standard GitHub-hosted runners.

# Quoted so YAML 1.1 parsers (VS Code) don't coerce the key `on` to the boolean
# `true` (the "Norway problem"); GitHub Actions reads it the same either way.
"on":
  push:
    branches: [main, develop]
  pull_request:

# Mínimos privilegios: ningún job de este workflow escribe en el repo.
permissions:
  contents: read

# Un push nuevo al mismo PR/rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (CPU-only torch)
        run: |
          uv sync --frozen
          # Replace the CUDA torch wheel from the lock with the CPU build:
          # the CI runners have no GPU and the CUDA wheel is multi-GB.
          uv pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff — errores reales, ver [tool.ruff])
        run: uv run ruff check src scripts tests

      - name: Run test suite
        run: uv run pytest -q

  # Auditoría de dependencias con vulnerabilidades conocidas (base OSV/PyPI).
  # No bloquea el PR (continue-on-error): el lock arrastra avisos de herramientas de desarrollo
  # (jupyter, gitpython...) que se van resolviendo con los PR de Dependabot. Cuando el listado
  # esté limpio, quitar `continue-on-error` para que bloquee.
  # Ignorar un aviso concreto y justificado: añadir `--ignore-vuln GHSA-xxxx-xxxx-xxxx`
  # (una vez por aviso) a la línea de pip-audit, con un comentario del motivo.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project --no-annotate > requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip
