[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Keep tmp_path only for failed tests (the last run): the trainer tests write
# checkpoints and the directories of passed runs used to pile up GBs in /tmp.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
