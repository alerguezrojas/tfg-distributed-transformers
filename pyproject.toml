[project]
name = "tfg-distributed-transformers"
version = "0.1.0"
description = "ParaViT-Lab: distributed training, analytic estimation and benchmarking of Vision Transformers on BigEarthNet-S2"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "nvidia-ml-py>=13.595.45",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "psutil>=7.2.2",
    "pyarrow>=23.0.1",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "streamlit>=1.57.0",
    "streamlit-option-menu>=0.4.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "plantuml>=0.3.0",
    "pytest>=9.0.3",
    "ruff>=0.6.9",
]

[tool.ruff]
target-version = "py312"
# Script manual antiguo de la web, sustituido por tests/integration/test_web_apptest.py.
extend-exclude = ["tests/run_web_tabs_check.py", "notebooks"]

[tool.ruff.lint]
# Solo errores reales (pyflakes + sintaxis): el lint no impone estilo ni reformatea.
select = ["F", "E9"]
